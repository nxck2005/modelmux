[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "modelmux"
version = "0.1.0"
description = "Scaffold for a harness-independent model routing core."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
service = [
    "starlette>=0.37,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/modelmux"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
